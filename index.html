<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>蒸汽红楼（暂名）</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=ZCOOL+QingKe+HuangYou&display=swap">
<style>
/* 布局：黄昏浮空园（宫崎骏式蒸汽朋克），一列竖屏——顶栏（季、头像、目标、步数）→ 8 比特棋盘 → 手里/下一个/储物格 → 技能栏；弹层做选人、季末、商店。刻意只做深色一种外观，不跟随系统 */
:root{
  --bg:#1E1620;       /* 黄昏暗底 */
  --panel:#2E2230;    /* 面板 */
  --panel2:#3D2D3C;   /* 按下 / 次级面板 */
  --line:#0E080C;     /* 描边、硬阴影 */
  --fg:#FFF1DE;       /* 字：暖白 */
  --mut:#C8A99A;      /* 次要字 */
  --pink:#FF8FA3; --lemon:#FFD36B; --mint:#A8DC7E; --sky:#8FD0EC; --violet:#B79BE0; --orange:#F2A05A;
  --display:"ZCOOL QingKe HuangYou","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --body:"PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
.app{max-width:420px;margin:0 auto;padding-block:10px 18px;display:flex;flex-direction:column;gap:10px}
.px{background:var(--panel);border:2px solid var(--line);box-shadow:3px 3px 0 var(--line)}
img.ico{image-rendering:pixelated;width:24px;height:24px;flex:none}
img.ico.s{width:18px;height:18px}
img.ico.l{width:40px;height:40px}
img.ico.xl{width:56px;height:56px}
header.top{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 8px}
.who{display:flex;align-items:center;gap:6px;min-width:0}
.season{font-family:var(--display);font-size:22px;line-height:1;letter-spacing:.04em;display:flex;align-items:center;gap:4px}
.season small{font-family:var(--body);font-size:12px;color:var(--mut);letter-spacing:0}
.stats{display:flex;gap:10px;font-size:13px;font-variant-numeric:tabular-nums;color:var(--mut)}
.stats b{font-size:16px;color:var(--fg)}
.stage{position:relative;display:flex;justify-content:center}
canvas#cv{image-rendering:pixelated;image-rendering:crisp-edges;display:block;touch-action:manipulation;cursor:pointer;max-width:100%;transition:transform .12s ease-out}
canvas#cv.punch{transform:scale(1.045);transition:none}
canvas#cv.punch2{transform:scale(1.08) rotate(-.6deg);transition:none}
.banner{position:absolute;left:50%;top:38%;filter:drop-shadow(0 0 6px rgba(255,190,90,.5));transform:translate(-50%,-50%);pointer-events:none;font-family:var(--display);
  font-size:44px;line-height:1;white-space:nowrap;color:var(--lemon);
  text-shadow:3px 0 0 var(--line),-3px 0 0 var(--line),0 3px 0 var(--line),0 -3px 0 var(--line),4px 4px 0 var(--line);
  animation:bn 1.1s steps(12) forwards}
.banner.combo{top:12%;font-size:26px;color:var(--pink);animation:cb .8s steps(8) forwards}
.banner.goal{top:9%;font-size:30px;color:var(--mint)}
@keyframes bn{0%{transform:translate(-50%,-50%) scale(.3)}15%{transform:translate(-50%,-50%) scale(1.25)}25%{transform:translate(-50%,-50%) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-80%) scale(1)}}
@keyframes cb{0%{transform:translate(-50%,0) scale(.4)}20%{transform:translate(-50%,0) scale(1.3)}35%{transform:translate(-50%,0) scale(1)}80%{opacity:1}100%{opacity:0}}
.hand{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:8px}
.slot{padding:6px 6px 8px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;color:var(--mut)}
.slot canvas{image-rendering:pixelated;width:44px;height:44px}
.slot.cur canvas{width:66px;height:66px}
.slot.cur{color:var(--fg)}
.slot.store{cursor:pointer}
.slot.store:focus-visible,button:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
.bar{display:flex;gap:8px;align-items:stretch}
button{font-family:var(--body);font-size:14px;color:var(--fg);background:var(--panel);border:2px solid var(--line);box-shadow:3px 3px 0 var(--line);padding:6px 10px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px}
button:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--line)}
button:disabled{opacity:.45;cursor:default}
button.on{background:var(--pink);color:var(--line)}
button.go{background:var(--mint);color:var(--line)}
.bar .skill{flex:1;justify-content:flex-start}
.tip{font-size:12px;line-height:1.5;color:var(--mut);text-align:center;min-height:18px}
.overlay[hidden]{display:none}
.overlay{position:fixed;inset:0;background:rgba(8,5,14,.72);display:flex;align-items:center;justify-content:center;
  padding:calc(16px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));z-index:20}
.card{max-width:400px;width:100%;max-height:100%;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
.card h2{font-family:var(--display);font-size:28px;font-weight:400;margin:0;letter-spacing:.04em;text-wrap:balance;display:flex;align-items:center;gap:8px}
.card p{margin:0;font-size:14px;line-height:1.6}
.choices{display:grid;gap:8px}
.choice{text-align:left;display:flex;align-items:center;gap:10px;padding:8px 10px;justify-content:flex-start}
.choice .txt{display:flex;flex-direction:column;gap:2px;min-width:0}
.choice b{font-family:var(--display);font-size:20px;font-weight:400}
.choice span{font-size:13px;line-height:1.5;color:var(--mut)}
.choice .price{color:var(--lemon);display:inline-flex;align-items:center;gap:4px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.coins{font-variant-numeric:tabular-nums;font-size:14px;padding:3px 8px;background:var(--panel2);border:2px solid var(--line);display:inline-flex;align-items:center;gap:4px;color:var(--lemon)}
.owned{font-size:12px;line-height:1.6;color:var(--mut);display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.big{font-family:var(--display);font-size:44px;line-height:1;color:var(--lemon)}
.note{font-size:11px;color:var(--mut);opacity:.7;text-align:center}
/* 字色：关键词有颜色，正文亮、次要暗 */
.kw{color:var(--lemon)} .kw-p{color:var(--pink)} .kw-g{color:var(--mint)} .kw-b{color:var(--sky)}
.c-daiyu{color:#8FDCC4} .c-baochai{color:#F7BE95} .c-xiangyun{color:#FF8FA3}
.chain{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:2px;padding:8px;background:var(--panel2);border:2px solid var(--line)}
.chain .ar{color:var(--mut);font-size:12px}
.chain .eq{color:var(--lemon);font-family:var(--display);font-size:18px;padding:0 4px}
.hrow{display:flex;align-items:center;gap:6px;font-size:14px;line-height:1.4}
.hrow .lbl{color:var(--fg)}
.charcard{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.charcard button{flex-direction:column;gap:6px;padding:10px 4px}
.charcard b{font-family:var(--display);font-size:22px;font-weight:400}
.charcard .sk{display:flex;align-items:center;gap:3px;font-size:12px;color:var(--fg)}
.small-link{background:none;border:none;box-shadow:none;color:var(--mut);font-size:12px;text-decoration:underline;padding:4px}
/* 我的大观园 */
.garden[hidden]{display:none}
.garden{position:fixed;inset:0;z-index:25;background:var(--bg);overflow:auto;
  padding:calc(10px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.garden .wrap{max-width:420px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
.garden .ghead{display:flex;align-items:center;gap:8px;padding:6px 8px}
.garden .ghead h2{font-family:var(--display);font-weight:400;font-size:24px;margin:0;flex:1;display:flex;align-items:center;gap:6px}
.garden .lv{display:flex;flex-direction:column;gap:3px;min-width:110px;font-size:12px;color:var(--mut)}
.garden .lv b{font-family:var(--display);font-weight:400;font-size:18px;color:var(--lemon)}
.garden .lvbar{height:6px;background:var(--panel2);border:2px solid var(--line)}
.garden .lvbar i{display:block;height:100%;background:var(--pink)}
.gview{overflow:auto;max-height:62vh;border:2px solid var(--line);background:#07070F;touch-action:pan-x pan-y;-webkit-overflow-scrolling:touch;cursor:grab;scrollbar-width:thin}
.gview canvas{image-rendering:pixelated;display:block;max-width:none}
.inv{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.inv button{flex-direction:column;gap:2px;padding:6px 2px;font-size:12px;font-variant-numeric:tabular-nums}
.inv button.sel{background:var(--lemon);color:var(--line)}
.inv button img{width:30px;height:30px;image-rendering:pixelated}
.dex{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--mut);padding:6px 8px}
.dex img{width:22px;height:22px;image-rendering:pixelated}
.dex img.no{filter:brightness(0) opacity(.45)}
.plot{position:relative}
.plot .gb{display:block;width:80%;height:5px;background:var(--panel2);border:1px solid var(--line)}
.plot .gb i{display:block;height:100%;background:var(--mint)}
.plot.ready{background:var(--lemon);color:var(--line)}
.earn{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:14px;font-variant-numeric:tabular-nums}
.earn span{display:inline-flex;align-items:center;gap:2px}
/* 新手引导 */
.tut[hidden]{display:none}
.tut{position:fixed;inset:0;z-index:30}
.tut .spot{position:fixed;box-shadow:0 0 0 9999px rgba(8,5,14,.72);border:2px solid var(--lemon);pointer-events:none;transition:all .18s steps(4)}
.tut .say{position:fixed;left:50%;transform:translateX(-50%);width:min(400px,calc(100% - 32px));padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.tut .say.top{top:calc(10px + env(safe-area-inset-top,0px))}
.tut .say.bottom{bottom:calc(14px + env(safe-area-inset-bottom,0px))}
.tut .say .line{display:flex;gap:10px;align-items:center;font-size:16px;line-height:1.45}
.tut .say .row2{display:flex;justify-content:space-between;align-items:center;gap:8px}
.tut .say.shake{animation:sh .3s steps(6)}
@keyframes sh{0%,100%{transform:translateX(-50%)}25%{transform:translateX(calc(-50% - 6px))}75%{transform:translateX(calc(-50% + 6px))}}
.tut .hand{position:fixed;width:36px;height:36px;image-rendering:pixelated;pointer-events:none;animation:hd .7s steps(2) infinite}
@keyframes hd{50%{transform:translate(4px,6px)}}
.tut .skip{font-size:12px;padding:4px 8px}
@media (prefers-reduced-motion:reduce){button:active{transform:none}.banner{animation-duration:.01s}canvas#cv{transition:none}}
</style>
</head>

<div class="app">
  <header class="top px">
    <div class="who"><img class="ico l" id="whoIco" alt=""><div class="season" id="seasonBox"><img class="ico s" id="seasonIco" alt=""><span id="seasonName">春</span><small id="seasonIdx">1/3</small></div></div>
    <div class="stats"><span>目标 <b id="target">90</b></span><span>空地 <b id="moves">0</b></span></div>
  </header>

  <div class="stage" id="stage"><canvas id="cv" width="112" height="128" aria-label="棋盘"></canvas></div>

  <div class="hand">
    <div class="slot cur px"><canvas id="cvCur" width="11" height="11"></canvas><div id="nmCur">手里：种子</div></div>
    <div class="slot px"><canvas id="cvNext" width="11" height="11"></canvas><div id="nmNext">下一个</div></div>
    <div class="slot store px" id="storeBox" tabindex="0" role="button" aria-label="储物格：点一下把手里的东西存起来或换出来"><canvas id="cvStore" width="11" height="11"></canvas><div id="nmStore">储物格</div></div>
  </div>

  <div class="bar">
    <button class="skill" id="skillBtn"><img class="ico" id="skillIco" alt=""><span id="skillTxt">技能</span></button>
    <button id="gardenBtn" aria-label="我的大观园"><img class="ico s" id="gardenIco" alt=""></button>
    <button id="helpBtn" aria-label="怎么玩"><img class="ico s" id="helpIco" alt=""></button>
    <button id="soundBtn" aria-pressed="true" aria-label="声音"><img class="ico s" id="soundIco" alt=""></button>
  </div>
  <div class="tip" id="tip">点一下看预览，再点一下放下</div>
  <div class="note">原型 2.1 · 宫崎骏式蒸汽朋克 · 8 比特代码绘制 · Kira</div>
</div>

<div class="overlay" id="ov" hidden><div class="card px" id="ovCard"></div></div>
<div class="garden" id="garden" hidden><div class="wrap">

  <div class="gview" id="gView"><canvas id="gcv" width="200" height="200" aria-label="我的园子"></canvas></div>
  <div class="px" style="padding:8px;display:flex;flex-direction:column;gap:6px"><div class="hrow" id="gNursHead"></div><div class="inv" id="gPlots" style="grid-template-columns:repeat(4,1fr)"></div></div>
  <div class="inv" id="gInv"></div>
  <div class="dex px" id="gDex"></div>
  <div class="tip" id="gTip">选一样 → 点地面摆上 · 点摆好的收回 · 拖动看园子</div>
  <button class="go" id="gGo" style="font-size:18px;padding:10px">出发 ▸</button>
</div></div>
<div class="tut" id="tut" hidden><div class="spot" id="tutSpot"></div><img class="hand" id="tutHand" alt="" hidden><div class="say px top" id="tutSay"></div></div>

function tone(f,d=0.08,type='square',vol=0.05,delay=0,slide=0){
  if(!soundOn)return;try{
  if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();
  const t=AC.currentTime+delay,o=AC.createOscillator(),v=AC.createGain();
  o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f*slide),t+d);
  v.gain.setValueAtTime(vol,t);v.gain.exponentialRampToValueAtTime(0.0001,t+d);
  o.connect(v).connect(AC.destination);o.start(t);o.stop(t+d+0.02);}catch(e){}
}
function noise(d=0.15,vol=0.06,delay=0){if(!soundOn)return;try{if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();
  const len=Math.floor(AC.sampleRate*d),bf=AC.createBuffer(1,len,AC.sampleRate),da=bf.getChannelData(0);
  for(let i=0;i<len;i++)da[i]=(Math.random()*2-1)*(1-i/len);
  const s=AC.createBufferSource(),v=AC.createGain(),fl=AC.createBiquadFilter();fl.type='lowpass';fl.frequency.value=1200;
  s.buffer=bf;v.gain.value=vol;s.connect(fl).connect(v).connect(AC.destination);s.start(AC.currentTime+delay);}catch(e){}}

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function refill(){if(S.pile.length===0)S.pile=shuffle([...S.bag,...Array(S.tut?0:BOTN[SEASONS[S.season].si]).fill('B')]);}
function draw(){if(S.tut)return S.tutQ.length?S.tutQ.shift():'T1';refill();return S.pile.pop();}
function peek(){if(S.tut)return S.tutQ[0]||'T1';refill();return S.pile[S.pile.length-1];}
function startSeason(){
  const se=SEASONS[S.season];const scrap=()=>S.relics.has('nostone')?'T1':'R1';
  // 一季的第一关铺新地图；第二、三关接着上一关的棋盘打
  if(se.k===0||!S.board){const M=MAPS[se.si];S.sock=new Set();
    S.board=M.map((row,r)=>[...row].map((ch,c)=>{if(ch==='+')S.sock.add(r+','+c);return ch==='#'?'W':ch==='r'?scrap():null;}));}
  S.score=0;S.shown=0;S.hold=0;S.goalHit=false;S.newBot=null;
  S.pile=[];S.cur=draw();S.store=Array(S.storeCap+(S.relics.has('bag')?1:0)).fill(null);
  S.uses=S.char.uses;S.mode=null;S.moveFrom=null;S.preview=null;S.busy=false;S.steps=0;
  if(se.boss==='rain')for(let i=0;i<4;i++){const [r,c]=randEmpty();if(r!=null)S.board[r][c]=scrap();}
  if(S.relics.has('sprout'))for(let i=0;i<2;i++){const [r,c]=randEmpty();if(r!=null)S.board[r][c]='T2';}
  if(S.relics.has('dew')){S.pile.push('D','D');shuffle(S.pile);}
  if(se.boss&&!window.__turbo)setTimeout(()=>bossIntro(se),60);
  ui();
}
const emptyN=()=>{let n=0;for(let r=0;r<N;r++)for(let c=0;c<N;c++)if(!S.board[r][c])n++;return n;};
function randEmpty(){const e=[];for(let r=0;r<N;r++)for(let c=0;c<N;c++)if(!S.board[r][c])e.push([r,c]);return e.length?e[Math.floor(Math.random()*e.length)]:[null,null];}
function full(){for(let r=0;r<N;r++)for(let c=0;c<N;c++)if(!S.board[r][c])return false;return true;}
const minGroup=id=>(S.relics.has('twin')&&TIER(id)>=3)?2:3;
function group(r,c,id,board=S.board){
  const seen=new Set([r+','+c]),out=[[r,c]],q=[[r,c]];
  while(q.length){const [a,b]=q.shift();for(const [dr,dc] of [[1,0],[-1,0],[0,1],[0,-1]]){const y=a+dr,x=b+dc;
    if(y<0||x<0||y>=N||x>=N)continue;const k=y+','+x;if(seen.has(k))continue;if(board[y][x]===id){seen.add(k);out.push([y,x]);q.push([y,x]);}}}
  return out;
}
function neighbors(r,c){return [[1,0],[-1,0],[0,1],[0,-1]].map(([a,b])=>[r+a,c+b]).filter(([y,x])=>y>=0&&x>=0&&y<N&&x<N);}
function resolveDew(r,c,board=S.board){
  const rank=v=>TIER(v)||(v==='R2'?1.5:0.5);
  const cands=[...new Set(neighbors(r,c).map(([y,x])=>board[y][x]).filter(v=>v&&v in NEXT))].sort((a,b)=>rank(b)-rank(a));
  for(const id of cands){board[r][c]=id;if(group(r,c,id,board).length>=minGroup(id))return id;}
  board[r][c]='T1';return 'T1';
}
function simulate(r,c,piece){
  const b=S.board.map(row=>row.slice());let id=piece;
  if(id==='D')id=resolveDew(r,c,b);else b[r][c]=id;
  const cells=group(r,c,id,b);const ok=(id in NEXT)&&cells.length>=minGroup(id);
  return {id,cells:ok?cells:[[r,c]],merges:ok};
}

function burst(x,y,cols,n,speed=1){for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,sp=(0.5+Math.random()*1.7)*speed;
  FX.parts.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-0.7,life:20+Math.random()*16,c:cols[i%cols.length],s:Math.random()<0.3?2:1});}}
function ring(x,y,maxR,c,delay=0){FX.rings.push({x,y,r:2,maxR,c,life:18,delay});}
function wave(x,y,maxR,c){FX.waves.push({x,y,r:1,maxR,c,life:16});}
function stars(x,y,n,spread){for(let i=0;i<n;i++)FX.stars.push({x:x+(Math.random()*2-1)*spread,y:y+(Math.random()*2-1)*spread,life:14+Math.random()*20,delay:Math.floor(Math.random()*10),c:Math.random()<.5?PAL.W:PAL.y});}
function petals(n){for(let i=0;i<n;i++)FX.petals.push({x:Math.random()*W,y:-4-Math.random()*40,vy:0.35+Math.random()*0.4,ph:Math.random()*6,life:180,c:Math.random()<.6?PAL.p:PAL.P});}
function sparksTo(x,y,n,c){for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2;FX.sparks.push({x,y,vx:Math.cos(a)*1.5,vy:Math.sin(a)*1.5-1,t:0,delay:6+i,c});}}
function firework(x,y,delay){setTimeout(()=>{burst(x,y,['y','m','e','l','v','W'].map(k=>PAL[k]),26,1.4);ring(x,y,10,PAL.y);stars(x,y,6,8);tone(700+Math.random()*500,0.12,'triangle',0.04);noise(0.12,0.04);},delay);}
function pop(x,y,base,mult,col){FX.pops.push({x,y,base,mult,col,life:60,age:0});}
function banner(text,cls=''){if(RM&&cls==='')return;const st=document.getElementById('stage');const d=document.createElement('div');d.className='banner '+cls;d.textContent=text;st.appendChild(d);setTimeout(()=>d.remove(),1200);}
function punch(big){if(RM)return;cv.classList.remove('punch','punch2');void cv.offsetWidth;cv.classList.add(big?'punch2':'punch');setTimeout(()=>cv.classList.remove('punch','punch2'),90);}
const COLS={T2:['l','L','W'],T3:['m','M','e','W'],T4:['v','e','m','W'],T5:['p','m','W','e'],T6:['m','e','y','W'],T7:['e','m','y','v','W'],R2:['u','U','W','e'],R1:['u','U','r','W'],clear:['y','m','e','l','v','W']};
const PRAISE={3:['好！','妙！','漂亮！'],4:['绝了！','神来之笔！','满园春色！']};

/* 爆炸分级：1 小合 · 2 中合 · 3 大合 · 4 满园 */
function level(tier,chain,terminal){if(terminal)return 4;const e=(tier-2)+(chain-1)*2;return e<=0?1:e<=2?2:e<=4?3:4;}
function explode(cx,cy,res,tier,chain,lv){
  const cols=(COLS[res]||COLS.clear).map(k=>PAL[k]);
  const spec=[null,{p:10,st:0,rg:1,sh:1,fl:0,hs:0},{p:20,st:5,rg:2,sh:2,fl:0,hs:1},{p:34,st:10,rg:3,sh:4,fl:.35,hs:4},{p:56,st:16,rg:3,sh:6,fl:.5,hs:7}][lv];
  burst(cx,cy,cols,spec.p+chain*4,1+lv*0.15);
  for(let i=0;i<spec.rg;i++)ring(cx,cy,6+tier*2+chain*2+i*5,i%2?PAL.p:PAL.W,i*3);
  if(spec.st)stars(cx,cy,spec.st,8+lv*3);
  if(lv>=3){wave(cx,cy,26+lv*6,PAL.y);petals(lv===3?12:28);}
  if(lv>=4){wave(cx,cy,48,PAL.p);const pts=[[20,40],[92,44],[30,100],[86,104],[56,70]];pts.forEach(([x,y],i)=>firework(x,y,120+i*110));FX.glow=70;}
  FX.shake=RM?0:Math.max(FX.shake,spec.sh);FX.stop=Math.max(FX.stop,spec.hs);
  if(spec.fl&&!RM){FX.flash=lv>=4?4:2;FX.flashA=spec.fl;}
  if(lv>=3){punch(lv>=4);banner(PRAISE[lv][Math.floor(Math.random()*PRAISE[lv].length)]);}
  sparksTo(cx,cy,2+lv*3,lv>=3?PAL.y:PAL.W);
  // 声音：音高随连锁和级别往上走
  const n=SCALE_NOTES[Math.min(SCALE_NOTES.length-1,tier-2+chain-1)]||523;
  tone(n,0.1,'square',0.05);
  if(lv>=2)tone(n*1.25,0.12,'square',0.035,0.04);
  if(lv>=3){tone(n*1.5,0.16,'triangle',0.04,0.08);tone(90,0.25,'sine',0.12,0,0.5);noise(0.18,0.07);}
  if(lv>=4){[0,1,2,3,4].forEach(i=>tone(SCALE_NOTES[i+3]||1319,0.12,'square',0.04,0.1+i*0.08));}
}

/* ---------- 流程 ---------- */
const wait=ms=>new Promise(res=>setTimeout(res,window.__turbo?0:ms));
async function place(r,c){
  if(S.busy||S.board[r][c])return;
  S.busy=true;S.preview=null;
  const was=S.cur;if(was==='D')resolveDew(r,c);else S.board[r][c]=was;S.newBot=was==='B'?[r,c]:null;
  FX.bounce[r+','+c]=8;const [x,y]=cellXY(r,c);
  for(let i=0;i<5;i++)FX.dust.push({x:x+8,y:y+14,vx:(i-2)*0.4,vy:-0.2,life:10});
  tone(220,0.05,'square',0.04,0,0.7);
  S.steps=(S.steps||0)+1;S.cur=draw();ui();
  if(was==='B'){tone(140,0.08,'square',0.04);tone(110,0.1,'square',0.04,0.06);}
  await resolveAt(r,c);await botsTurn();await bossTick();await afterTurn();
}
async function bossTick(){
  const se=SEASONS[S.season];if(!se.boss||S.tut)return;
  if(se.boss==='wind'&&S.steps%5===0){const t=[];for(let r=0;r<N;r++)for(let c=0;c<N;c++)if(S.board[r][c]==='T1'||S.board[r][c]==='T2')t.push([r,c]);
    if(t.length){const [r,c]=t[Math.floor(Math.random()*t.length)];const [x,y]=cellXY(r,c);burst(x+8,y+8,[PAL.g,PAL.o,PAL.W],12);S.board[r][c]=null;noise(0.3,0.05);FX.shake=2;tip('狂风刮走了一株');ui();await wait(350);}}
  if(se.boss==='snow'&&S.steps%4===0){const [r,c]=randEmpty();if(r!=null){S.board[r][c]='X1';const [x,y]=cellXY(r,c);burst(x+8,y+8,[PAL.W,PAL.b],10);tone(1400,0.15,'triangle',0.03,0,0.5);FX.bounce[r+','+c]=8;tip('霜冻住一格');ui();await wait(300);}}
}
function bossIntro(se){const b=BOSS[se.boss];
  openOv(`<h2>${img(b.ico,'l')}<span class="kw-p">${b.n}</span></h2><div class="hrow" style="font-size:18px">${fmt(b.fx)}</div><button class="go" id="bossOk">来吧</button>`);
  document.getElementById('bossOk').addEventListener('click',closeOv);tone(196,0.3,'square',0.05,0,0.7);}
/* 发条机：每回合往旁边空格走一格；一群发条机被围得一格都走不了，就一起报废成废齿轮 */
async function botsTurn(){
  if(S.tut)return;const nb=S.newBot;const isNew=(r,c)=>nb&&nb[0]===r&&nb[1]===c;
  const bots=[];for(let r=0;r<N;r++)for(let c=0;c<N;c++)if(S.board[r][c]==='B'&&!isNew(r,c))bots.push([r,c]);
  const mv=[];shuffle(bots).forEach(([r,c])=>{const e=neighbors(r,c).filter(([y,x])=>!S.board[y][x]);if(!e.length)return;
    const [y,x]=e[Math.floor(Math.random()*e.length)];S.board[r][c]=null;S.board[y][x]='B';mv.push([r,c,y,x]);});
  if(mv.length){mv.forEach(([r,c,y,x])=>{S.board[y][x]=null;});
    FX.moving=mv.map(([r,c,y,x])=>{const [sx,sy]=cellXY(r,c),[tx,ty]=cellXY(y,x);return {id:'B',sx,sy,tx,ty,t:0};});
    tone(880,0.03,'square',0.015);await wait(150);FX.moving=[];mv.forEach(([r,c,y,x])=>{S.board[y][x]='B';FX.bounce[y+','+x]=5;});ui();}
  // 围住了吗
  const seen=new Set();const dead=[];
  for(let r=0;r<N;r++)for(let c=0;c<N;c++){if(S.board[r][c]!=='B'||seen.has(r+','+c))continue;const g2=group(r,c,'B');g2.forEach(([y,x])=>seen.add(y+','+x));
    if(!g2.some(([y,x])=>neighbors(y,x).some(([a,b])=>!S.board[a][b])))dead.push(g2);}
  for(const g2 of dead){const to=S.relics.has('soil')?'T3':'R1';
    g2.forEach(([y,x])=>{S.board[y][x]=to;const [px,py]=cellXY(y,x);burst(px+8,py+8,(COLS.R1).map(k=>PAL[k]),16,1.2);ring(px+8,py+8,10,PAL.r);FX.bounce[y+','+x]=10;});
    const gain=25*g2.length;S.score+=gain;S.hold=Math.max(S.hold,12);const [px,py]=cellXY(...g2[0]);pop(px+8,py-1,gain,1,PAL.r);
    noise(0.25,0.07);tone(220,0.2,'sawtooth',0.04,0,0.4);FX.shake=Math.max(FX.shake,3);banner('围住了！','combo');tip('发条机停摆了');ui();await wait(380);
    const last=g2.find(([y,x])=>isNew(y,x))||g2[g2.length-1];await resolveAt(last[0],last[1]);
    for(const [y,x] of g2){if(S.board[y][x]===to)await resolveAt(y,x);}}
}
async function resolveAt(r,c){
  let chain=1;
  while(true){
    const id=S.board[r][c];if(!id||!(id in NEXT))break;
    const grp=group(r,c,id);if(grp.length<minGroup(id))break;
    await mergeStep(grp,r,c,id,chain);chain++;
    if(!NEXT[id])break;
  }
}
async function mergeStep(grp,r,c,id,chain){
  const nxt=NEXT[id];
  const [tx,ty]=cellXY(r,c);
  // 1) 预备：要合的那几格抖一下
  FX.shake=Math.max(FX.shake,RM?0:0.8);
  // 2) 收拢
  FX.moving=grp.filter(([y,x])=>!(y===r&&x===c)).map(([y,x])=>{const [sx,sy]=cellXY(y,x);return {id,sx,sy,tx,ty,t:0};});
  grp.forEach(([y,x])=>{if(!(y===r&&x===c))S.board[y][x]=null;});
  tone(300+chain*40,0.12,'triangle',0.03,0,1.6);
  await wait(160);FX.moving=[];
  // 3) 合成
  let mult=chain+(S.relics.has('link')?chain-1:0);
  if(S.sock&&S.sock.has(r+','+c)){mult*=2;banner('铜盘 ×2','combo');}
  if(S.relics.has('pavilion')&&neighbors(r,c).some(([y,x])=>S.board[y][x]==='T6'||S.board[y][x]==='T7'))mult+=2;
  let base,res,terminal=false;
  if(nxt){res=nxt;S.board[r][c]=nxt;base=PTS[nxt]*grp.length;if(nxt==='R2'&&S.relics.has('stone'))base*=4;}
  else{res='clear';terminal=true;S.board[r][c]=null;base=TERMINAL[id];}
  const gain=base*mult;S.score+=gain;S.hold=Math.max(S.hold,14);
  {const m=nxt?(VALUE[nxt]?nxt:null):id;if(m&&!S.tut){S.earn=S.earn||{};S.earn[m]=(S.earn[m]||0)+1;}}
  const tier=TIER(res)||(res==='R2'?3:7);const lv=level(tier,chain,terminal);
  const cx=tx+CELL/2,cy=ty+CELL/2;
  explode(cx,cy,res,tier,chain,lv);
  pop(cx,ty-1,base,mult,lv>=3?PAL.y:PAL.W);
  FX.bounce[r+','+c]=10;
  if(chain>=2)banner('连锁 ×'+chain,'combo');
  if(res==='T5'&&S.relics.has('bamboo')){neighbors(r,c).forEach(([y,x])=>{if(S.board[y][x]==='T1'){S.board[y][x]='T2';const [px,py]=cellXY(y,x);burst(px+8,py+8,[PAL.g,PAL.W],8);FX.bounce[y+','+x]=8;}});}
  ui();await wait(260+lv*70);
}
async function afterTurn(){
  if(S.tut){S.busy=false;ui();return tutAfter();}
  if(S.score>=SEASONS[S.season].target||full()){await wait(400);return endSeason();}
  S.busy=false;ui();
}
function cherishBonus(){
  if(!S.relics.has('cherish'))return 0;let s=0;
  for(let r=0;r<N;r++)for(let c=0;c<N;c++){const id=S.board[r][c];if(TIER(id)>=3){s+=PTS[id];const [x,y]=cellXY(r,c);stars(x+8,y+8,3,4);}}
  return s;
}
async function endSeason(){
  S.busy=true;
  const se=SEASONS[S.season];
  const bonus=cherishBonus();if(bonus){S.score+=bonus;S.hold=10;pop(W/2,BY+40,bonus,1,PAL.p);tone(660,0.12,'triangle');await wait(700);}
  if(window.__turbo)S.shown=S.score;while(S.shown<S.score)await wait(50);
  const pass=S.score>=se.target;
  // 达标就过关：剩下的空地一格放一朵烟花，每两格空地 = 1 养料
  let saved=0;
  if(pass){
    await wait(500);
    const em=[];for(let r=0;r<N;r++)for(let c=0;c<N;c++)if(!S.board[r][c])em.push([r,c]);
    saved=Math.ceil(em.length/2);
    if(em.length&&!window.__turbo){banner('空地变养料','goal');await wait(450);
      for(const [r,c] of em){const [x,y]=cellXY(r,c);firework(x+8,y+8,0);pop(x+8,y+4,1,1,PAL.l);await wait(em.length>12?90:150);}
      await wait(700);}
  }
  S.totalScore+=S.score;S.lastEarn=commitEarn();
  G.fert=(G.fert||0)+saved;S.lastSaved=saved;S.lastEmb=pass?dropEmbryo():null;growPlots(1);saveGarden();
  if(window.__onStageEnd)return window.__onStageEnd(pass);
  if(pass){
    if(S.season===SEASONS.length-1){saveBest(S.totalScore);return showWin();}
    showSeasonEnd(true);
  }else{saveBest(S.totalScore);showSeasonEnd(false);}
}

function cellAt(x,y){const rect=cv.getBoundingClientRect();const lx=(x-rect.left)/rect.width*W,ly=(y-rect.top)/rect.height*H;
  const c=Math.floor((lx-BX)/CELL),r=Math.floor((ly-BY)/CELL);return (r<0||c<0||r>=N||c>=N)?null:[r,c];}
cv.addEventListener('pointerdown',e=>{const rc=cellAt(e.clientX,e.clientY);if(rc)cellTap(rc[0],rc[1]);});
function cellTap(r,c){
  if(!S||S.busy)return;
  if(S.mode==='bury'){
    if(!S.board[r][c]||S.board[r][c]==='W')return tip('点有东西的格子');
    const [x,y]=cellXY(r,c);burst(x+8,y+8,[PAL.p,PAL.P,PAL.W],18);petals(8);tone(520,0.2,'triangle',0.05,0,0.6);
    S.board[r][c]=null;S.uses--;S.mode=null;ui();return tip('收走了');
  }
  if(S.mode==='move'){
    if(!S.moveFrom){if(!S.board[r][c]||S.board[r][c]==='W')return tip('点要挪的东西');S.moveFrom=[r,c];ui();return tip('再点一个空格');}
    if(S.board[r][c])return tip('要挪到空格');
    const [fr,fc]=S.moveFrom;S.board[r][c]=S.board[fr][fc];S.board[fr][fc]=null;S.uses--;S.mode=null;S.moveFrom=null;
    tone(440,0.1,'triangle',0.05,0,1.5);FX.bounce[r+','+c]=8;
    (async()=>{S.busy=true;ui();await resolveAt(r,c);await afterTurn();})();return;
  }
  if(S.board[r][c])return tip('这格有东西了');
  if(S.preview&&S.preview.r===r&&S.preview.c===c){place(r,c);return;}
  const sim=simulate(r,c,S.cur);S.preview={r,c,...sim};
  tip(sim.merges?`合成 ${sim.cells.length} 个${NAME[sim.id]} · 再点一下放下`:'再点一下放下');
  tone(sim.merges?520:180,0.03,'square',0.025);
}

/* ---------- 绘制循环 ---------- */
let tick=0;
function frame(){
  requestAnimationFrame(frame);
  if(!S)return;tick++;
  if(FX.stop>0){FX.stop--;}else{
    FX.parts.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=0.08;p.vx*=0.98;p.life--;});FX.parts=FX.parts.filter(p=>p.life>0);
    FX.rings.forEach(r=>{if(r.delay>0){r.delay--;return;}r.r+=(r.maxR-r.r)*0.25;r.life--;});FX.rings=FX.rings.filter(r=>r.life>0);
    FX.waves.forEach(w=>{w.r+=(w.maxR-w.r)*0.2;w.life--;});FX.waves=FX.waves.filter(w=>w.life>0);
    FX.stars.forEach(s=>{if(s.delay>0)s.delay--;else s.life--;});FX.stars=FX.stars.filter(s=>s.life>0);
    FX.petals.forEach(p=>{p.y+=p.vy;p.x+=Math.sin((tick+p.ph*20)/14)*0.35;p.life--;});FX.petals=FX.petals.filter(p=>p.life>0&&p.y<H+4);
    FX.dust.forEach(d=>{d.x+=d.vx;d.y+=d.vy;d.life--;});FX.dust=FX.dust.filter(d=>d.life>0);
    FX.sparks.forEach(s=>{if(s.delay>0){s.delay--;s.x+=s.vx;s.y+=s.vy;s.vy+=0.05;return;}s.t=Math.min(1,s.t+0.07);const tx=BAR.x+Math.min(BAR.w,BAR.w*Math.min(1,S.shown/SEASONS[S.season].target)),ty=BAR.y+2;
      s.x+=(tx-s.x)*s.t*0.5;s.y+=(ty-s.y)*s.t*0.5;});FX.sparks=FX.sparks.filter(s=>s.t<1);
    FX.pops.forEach(p=>{p.age++;p.life--;});FX.pops=FX.pops.filter(p=>p.life>0);
    FX.moving.forEach(m=>{m.t=Math.min(1,m.t+0.13);});
    for(const k in FX.bounce){FX.bounce[k]--;if(FX.bounce[k]<=0)delete FX.bounce[k];}
    if(FX.shake>0)FX.shake=Math.max(0,FX.shake-0.3);if(FX.flash>0)FX.flash--;if(FX.glow>0)FX.glow--;
    // 分数：先停一下，再一路数上去（越数越快），过目标时放「达标」
    const se=SEASONS[S.season];
    if(S.hold>0)S.hold--;
    else if(S.shown<S.score){const step=Math.max(1,Math.ceil((S.score-S.shown)*0.1));S.shown=Math.min(S.score,S.shown+step);
      if(tick%2===0)tone(700+Math.min(900,(S.shown/se.target)*500),0.025,'square',0.018);
      if(!S.goalHit&&S.shown>=se.target){S.goalHit=true;banner('达标！','goal');tone(784,0.1,'square',0.05);tone(1047,0.18,'square',0.05,0.1);stars(BAR.x+BAR.w-6,BAR.y,10,8);}}
    if(S.goalHit&&tick%3===0)FX.flames.push({x:BAR.x+Math.random()*BAR.w*Math.min(1,S.shown/se.target),y:BAR.y,life:10+Math.random()*8});
    FX.flames.forEach(f=>{f.y-=0.4;f.life--;});FX.flames=FX.flames.filter(f=>f.life>0);
  }
  render();
}
function render(){
  const se=SEASONS[S.season];
  g.fillStyle='#1E1620';g.fillRect(0,0,W,H);
  const sk=FX.shake>0?FX.shake:0;const sx=sk?Math.round((Math.random()*2-1)*sk):0,sy=sk?Math.round((Math.random()*2-1)*sk):0;
  g.save();g.translate(sx,sy);
  // 分数条 + 达标火苗
  const pct=Math.min(1,S.shown/se.target);
  FX.flames.forEach(f=>{g.fillStyle=f.life>12?PAL.y:f.life>6?PAL.o:PAL.r;g.fillRect(Math.round(f.x),Math.round(f.y),1,1);});
  g.fillStyle=PAL.x;g.fillRect(BAR.x-1,BAR.y-1,BAR.w+2,6);g.fillStyle='#2E2230';g.fillRect(BAR.x,BAR.y,BAR.w,4);
  g.fillStyle=S.goalHit?(Math.floor(tick/6)%2?PAL.y:PAL.l):PAL.e;g.fillRect(BAR.x,BAR.y,Math.round(BAR.w*pct),4);
  g.fillStyle='rgba(255,255,255,.35)';g.fillRect(BAR.x,BAR.y,Math.round(BAR.w*pct),1);
  const counting=S.shown<S.score&&S.hold<=0;const jx=counting?(tick%2?1:0):0;
  drawNum(g,S.shown,6+jx,3,S.goalHit?PAL.y:PAL.W,2);
  const tStr='/'+se.target;drawNum(g,tStr,W-6-numW(tStr),6,'#A797C4',1,false);
  // 棋盘
  const glowC=FX.glow>0?[PAL.p,PAL.y,PAL.b,PAL.g,PAL.v][Math.floor(tick/4)%5]:PAL.x;
  g.fillStyle=glowC;g.fillRect(BX-2,BY-2,N*CELL+4,N*CELL+4);
  for(let r=0;r<N;r++)for(let c=0;c<N;c++){const [x,y]=cellXY(r,c);
    if(S.board[r][c]==='W'){g.fillStyle='#3A2A44';g.fillRect(x,y,CELL,CELL);const sh=Math.floor(tick/30)%CELL;g.fillStyle='#8A6A80';g.fillRect(x+((sh+3)%CELL),y+5,4,1);g.fillRect(x+((sh+10)%CELL),y+11,5,1);g.fillStyle='#1E1620';g.fillRect(x,y,CELL,1);g.fillRect(x,y,1,CELL);continue;}
    g.fillStyle=(r+c)%2?'#34402A':'#2F3A26';g.fillRect(x,y,CELL,CELL);
    if((r*7+c*3)%5===0){g.fillStyle='#46573A';g.fillRect(x+3+((r+c)%3)*4,y+12,1,2);g.fillRect(x+4+((r+c)%3)*4,y+11,1,3);}
    if(S.sock&&S.sock.has(r+','+c)){const on=Math.floor((tick+r*9+c*5)/20)%2;g.fillStyle=on?PAL.e:PAL.E;
      const q=CELL-2,f=(a,b,w,h)=>g.fillRect(x+a,y+b,w,h);f(1,1,3,1);f(1,1,1,3);f(q-2,1,3,1);f(q,1,1,3);f(1,q,3,1);f(1,q-2,1,3);f(q-2,q,3,1);f(q,q-2,1,3);
      if(!S.board[r][c]){g.fillStyle=on?'#7A5426':'#5E4020';g.fillRect(x+5,y+5,7,7);g.fillStyle=PAL.e;g.fillRect(x+8,y+4,1,9);g.fillRect(x+4,y+8,9,1);g.fillStyle='#3E2A18';g.fillRect(x+7,y+7,3,3);}}}
  // 预览
  if(S.preview){const p=S.preview;const pulse=Math.floor(tick/8)%2;
    if(p.merges){g.fillStyle=pulse?'rgba(255,228,92,.38)':'rgba(255,228,92,.24)';p.cells.forEach(([y,x])=>{const [px,py]=cellXY(y,x);g.fillRect(px,py,CELL,CELL);});}
    const [px,py]=cellXY(p.r,p.c);g.globalAlpha=0.55+0.3*Math.sin(tick/8);g.drawImage(spr(p.id||S.cur),px+3,py+3-(pulse?1:0));g.globalAlpha=1;
    g.strokeStyle=PAL.y;g.lineWidth=1;g.strokeRect(px+0.5,py+0.5,CELL-1,CELL-1);}
  if(S.moveFrom){const [px,py]=cellXY(...S.moveFrom);g.strokeStyle=PAL.p;g.strokeRect(px+0.5,py+0.5,CELL-1,CELL-1);}
  // 东西：植物随风轻摆，要合成的那几格抖一下
  const preCells=S.preview&&S.preview.merges?new Set(S.preview.cells.map(([y,x])=>y+','+x)):null;
  for(let r=0;r<N;r++)for(let c=0;c<N;c++){const id=S.board[r][c];if(!id||id==='W')continue;const [x,y]=cellXY(r,c);
    const b=FX.bounce[r+','+c]||0;let dy=b>6?-2:b>2?-1:0,dx=0;
    const t=TIER(id);if(t>=2&&t<=5&&Math.floor((tick+r*17+c*29)/40)%2===0)dx=1;
    if(preCells&&preCells.has(r+','+c))dx=(tick%4<2)?1:-1;
    if(id==='B'){dy+=Math.floor((tick+r*13+c*7)/10)%2?-1:0;g.fillStyle='rgba(240,80,106,.25)';g.fillRect(x+4,y+14,9,2);}
    g.drawImage(spr(id),x+3+dx,y+3+dy);}
  FX.moving.forEach(m=>{const e=m.t*m.t;g.drawImage(spr(m.id),Math.round(m.sx+(m.tx-m.sx)*e)+3,Math.round(m.sy+(m.ty-m.sy)*e)+3);});
  // 落地的灰
  FX.dust.forEach(d=>{g.fillStyle='#8A7A60';g.fillRect(Math.round(d.x),Math.round(d.y),1,1);});
  // 冲击波（菱形）、光环（方形）
  FX.waves.forEach(w=>{g.fillStyle=w.c;const r=Math.round(w.r);for(let i=0;i<=r;i++){const j=r-i;[[i,j],[-i,j],[i,-j],[-i,-j]].forEach(([a,b2])=>g.fillRect(Math.round(w.x+a),Math.round(w.y+b2),1,1));}});
  FX.rings.forEach(r=>{if(r.delay>0)return;g.strokeStyle=r.c;g.lineWidth=1;const s=Math.round(r.r);g.strokeRect(Math.round(r.x-s)+0.5,Math.round(r.y-s)+0.5,s*2,s*2);});
  FX.parts.forEach(p=>{g.fillStyle=p.c;g.fillRect(Math.round(p.x),Math.round(p.y),p.s,p.s);});
  FX.stars.forEach(s=>{if(s.delay>0)return;g.fillStyle=s.c;const x=Math.round(s.x),y=Math.round(s.y);g.fillRect(x,y,1,1);if(s.life>8){g.fillRect(x-1,y,1,1);g.fillRect(x+1,y,1,1);g.fillRect(x,y-1,1,1);g.fillRect(x,y+1,1,1);}});
  FX.sparks.forEach(s=>{g.fillStyle=s.c;g.fillRect(Math.round(s.x),Math.round(s.y),1,1);});
  // 跳数字：先蹦出「+基础分」，再砸上「×倍数」
  FX.pops.forEach(p=>{const showMult=p.mult>1&&p.age>=10;const txt='+'+p.base+(showMult?'x'+p.mult:'');
    const s=(p.age<4||(showMult&&p.age<14))?2:1;const y=Math.round(p.y-Math.min(10,p.age*0.35));const w=numW(txt,s);
    drawNum(g,txt,Math.round(Math.max(1,Math.min(W-w-1,p.x-w/2))),y,showMult?PAL.y:p.col,s);});
  g.restore();
  FX.petals.forEach(p=>{g.fillStyle=p.c;g.fillRect(Math.round(p.x),Math.round(p.y),2,1);g.fillRect(Math.round(p.x)+1,Math.round(p.y)+1,1,1);});
  if(FX.flash>0){g.fillStyle=`rgba(255,248,240,${FX.flashA})`;g.fillRect(0,0,W,H);}
  ctx.imageSmoothingEnabled=false;ctx.clearRect(0,0,cv.width,cv.height);ctx.drawImage(buf,0,0,W*SCALE,H*SCALE);
}

/* ---------- 新手引导（照《墨》引导设计：压暗、只亮该点的、一步一件事、随时跳过） ---------- */
const TUT=[
 {say:'把东西放进格子，三个一样就合成', show:'chain'},
 {say:'点亮着的格子，<span class="kw">再点一下</span>放下', cell:[2,3], setup:()=>{S.board[2][1]='T1';S.board[2][2]='T1';S.cur='T1';S.tutQ=['T1','R1','T1','T1'];}},
 {say:'三个 {T1} 合成一个 {T2}'},
 {say:'放这里，看<span class="kw-p">连锁</span>', cell:[1,4], setup:()=>{S.board[0][4]='T1';S.board[1][5]='T1';S.board[2][4]='T2';S.cur='T1';}},
 {say:'<span class="kw-p">连锁</span>一次，倍数 +1，炸得更大'},
 {say:'不想要的 {R1}，先放进<span class="kw-g">储物格</span>', store:true, setup:()=>{S.cur='R1';S.tutQ=['T1','T1','T2'];}},
 {say:'分数到头就过关<br>棋盘<span class="kw-p">满了就输</span>', bar:true, pos:'bottom'},
 {say:'{B} 发条机会乱走<br><span class="kw">围住</span>它，就停摆成 {R1}'},
 {say:'去选一位姑娘吧', end:true}
];
let TI=0;const tutEl=document.getElementById('tut'),spotEl=document.getElementById('tutSpot'),sayEl=document.getElementById('tutSay'),handEl=document.getElementById('tutHand');
handEl.src=icoURL('hand');
function startTut(){
  closeOv();
  S={char:CHARS[0],season:0,coins:0,relics:new Set(),bag:['T1'],pile:[],sock:new Set(),board:Array.from({length:N},()=>Array(N).fill(null)),
     score:0,shown:0,hold:0,moves:SEASONS[0].moves,cur:'T1',store:[null],storeCap:1,uses:0,mode:null,moveFrom:null,preview:null,busy:false,totalScore:0,goalHit:false,
     tut:true,tutQ:[]};
  TI=0;tutEl.hidden=false;tutShow();
}
function tutRect(st){
  const cr=cv.getBoundingClientRect(),k=cr.width/W;
  if(st.cell){const [r,c]=st.cell,[x,y]=cellXY(r,c);return {x:cr.left+x*k,y:cr.top+y*k,w:CELL*k,h:CELL*k};}
  if(st.store){const b=document.getElementById('storeBox').getBoundingClientRect();return {x:b.left,y:b.top,w:b.width,h:b.height};}
  if(st.bar){return {x:cr.left+(BAR.x-2)*k,y:cr.top+1*k,w:(BAR.w+4)*k,h:21*k};}
  return null;
}
function tutShow(){
  const st=TUT[TI];if(st.setup)st.setup();S.preview=null;ui();
  const act=st.cell||st.store;
  sayEl.className='say px '+(st.pos||'top');
  sayEl.innerHTML=`<div class="line">${img('daiyu','l')}<div>${fmt(st.say)}</div></div>
   ${st.show==='chain'?chainRow():''}
   <div class="row2"><button class="small-link skip" id="tutSkip">跳过引导</button>${act?'':`<button class="go" id="tutOk">${st.end?'开始':'好'}</button>`}</div>`;
  document.getElementById('tutSkip').addEventListener('click',endTut);
  const ok=document.getElementById('tutOk');if(ok)ok.addEventListener('click',e=>{e.stopPropagation();tutNext();});
  const r=tutRect(st);
  if(r){Object.assign(spotEl.style,{left:r.x-3+'px',top:r.y-3+'px',width:r.w+6+'px',height:r.h+6+'px',display:'block'});}
  else Object.assign(spotEl.style,{left:'50%',top:'50%',width:'0px',height:'0px'});
  if(act&&r){handEl.hidden=false;handEl.style.left=(r.x+r.w*0.55)+'px';handEl.style.top=(r.y+r.h*0.55)+'px';}else handEl.hidden=true;
}
tutEl.addEventListener('pointerdown',e=>{
  if(e.target.closest('button'))return;
  const st=TUT[TI];const r=tutRect(st);
  const inside=r&&e.clientX>=r.x&&e.clientX<=r.x+r.w&&e.clientY>=r.y&&e.clientY<=r.y+r.h;
  if(inside&&st.cell&&!S.busy){cellTap(st.cell[0],st.cell[1]);if(S.preview)tutHint('再点一下');return;}
  if(inside&&st.store){swapStore();return;}
  sayEl.classList.remove('shake');void sayEl.offsetWidth;sayEl.classList.add('shake');
});
function tutHint(t){const d=sayEl.querySelector('.line div');if(d&&!d.dataset.h){d.dataset.h=1;d.innerHTML+=` · <span class="kw">${t}</span>`;}}
function tutAfter(kind){const st=TUT[TI];if(!st)return;if((st.cell&&kind!=='store')||(st.store&&kind==='store'))setTimeout(tutNext,st.cell?500:250);}
function tutNext(){TI++;if(TI>=TUT.length)return endTut();tutShow();}
function endTut(){tutEl.hidden=true;handEl.hidden=true;try{localStorage.setItem('dgy-sanheyi-tut','1');}catch(e){}S.tut=false;showChars();}

  for(let j=0;j<3;j++){const cy=Hd*(0.82+j*0.06);gg.fillStyle=['rgba(214,150,150,.35)','rgba(190,120,130,.45)','rgba(160,100,115,.6)'][j];
    for(let k=0;k<10;k++){const w=26+Math.floor(hsh(k,j,9)*30),cx=((hsh(k,j,8)*Wd*1.5+gTick*(0.03+j*0.02))%(Wd+60))-30;gg.fillRect(Math.round(cx),Math.round(cy),w,4);gg.fillRect(Math.round(cx)+4,Math.round(cy)-2,w-8,2);}}
}
function gFrame(){
  if(!gOpen)return;requestAnimationFrame(gFrame);gTick++;
  const size=LEVELS[lvOf(beauty())].size,off=Math.floor((GN-size)/2);
  drawSkyCity();
  // 园子底座：悬在城市上空
  {const bx=GM+off*GT,bw=size*GT,by=GM+(off+size)*GT;gg.fillStyle='#4A3428';gg.fillRect(bx,by,bw,4);gg.fillStyle='#3A281F';gg.fillRect(bx+4,by+4,bw-8,4);gg.fillRect(bx+12,by+8,bw-24,4);gg.fillRect(bx+bw/2-10,by+12,20,3);
    gg.fillStyle='#5A7A3A';for(let i=bx+3;i<bx+bw-3;i+=7)gg.fillRect(i,by+4+(i%3),1,3+(i%4));
    const sp=Math.floor(gTick/3)%2;[[bx-2,by-6],[bx+bw-5,by-6]].forEach(([px,py])=>{gg.fillStyle=PAL.E;gg.fillRect(px+1,py,2,8);gg.fillStyle=PAL.e;if(sp)gg.fillRect(px-3,py+8,10,1);else gg.fillRect(px+1,py+6,2,5);});
    gg.fillStyle='rgba(230,207,160,.18)';const pf=Math.floor(gTick/10)%4;gg.fillRect(bx+bw/2-2,by+16+pf,4,2);}
  const TT=terrain();
  for(let r=0;r<GN;r++)for(let c=0;c<GN;c++){const x=GM+c*GT,y=GM+r*GT,inside=c>=off&&r>=off&&c<off+size&&r<off+size;drawTile(TT,c,r,x,y,inside);}
  // 选着东西时，淡淡标出黄金分割点
  if(gSel){const pulse=Math.floor(gTick/15)%2;golden(size,off).forEach(([gx,gy])=>{const x=GM+gx*GT,y=GM+gy*GT;gg.fillStyle=pulse?'rgba(255,228,92,.55)':'rgba(255,228,92,.3)';
    gg.fillRect(x,y,2,1);gg.fillRect(x,y,1,2);gg.fillRect(x+GT-2,y,2,1);gg.fillRect(x+GT-1,y,1,2);gg.fillRect(x,y+GT-1,2,1);gg.fillRect(x,y+GT-2,1,2);gg.fillRect(x+GT-2,y+GT-1,2,1);gg.fillRect(x+GT-1,y+GT-2,1,2);});}
  // 篱笆
  const fx=GM+off*GT-1,fy=GM+off*GT-1,fw=size*GT+2;
  gg.fillStyle='#6A4A30';gg.fillRect(fx,fy,fw,1);gg.fillRect(fx,fy+fw-1,fw,1);gg.fillRect(fx,fy,1,fw);gg.fillRect(fx+fw-1,fy,1,fw);
  gg.fillStyle=PAL.e;for(let i=0;i<fw;i+=6){gg.fillRect(fx+i,fy-1,1,2);gg.fillRect(fx+i,fy+fw-2,1,2);gg.fillRect(fx-1,fy+i,2,1);gg.fillRect(fx+fw-2,fy+i,2,1);}
  // 摆件、动物、小人一起按「脚的位置」排前后；大树 2 倍、亭楼 3 倍，人比花高、比树矮
  const items=[];gg.imageSmoothingEnabled=false;
  G.placed.forEach(o=>{const t=TIER(o.id);const k=t>=6?3:(t===5||o.id==='R2')?2:1;const sz=11*k;
    const jx=Math.round((hsh(o.x,o.y,1)-0.5)*4),jy=Math.round((hsh(o.x,o.y,2)-0.5)*2);const foot=GM+(o.y+1)*GT-1+jy;
    items.push({foot,draw:()=>{const sway=(t>=3&&t<=5&&Math.floor((gTick+o.x*13+o.y*7)/45)%2)?1:0;const x=Math.round(GM+o.x*GT+GT/2-sz/2+jx);
      gg.fillStyle='rgba(0,0,8,.45)';gg.fillRect(x+Math.round(sz*0.15),foot-1,Math.round(sz*0.7),2);
      gg.drawImage(spr(o.id),0,0,11,11,x+sway,foot-sz,sz,sz);
      if(t>=5&&Math.floor((gTick+o.x*31)/30)%5===0){gg.fillStyle=PAL.W;gg.fillRect(x+Math.floor(hsh(o.x,o.y,gTick>>5)*sz),foot-sz+Math.floor(hsh(o.y,o.x,gTick>>5)*sz*0.6),1,1);}}});});
  const cx=GM+(off+size/2)*GT,cy=GM+(off+size/2)*GT;
  BEINGS.filter(b=>b.kind==='animal'&&G.owned[b.id]).forEach((b,i)=>{const t=gTick/140+i*1.9;const ax=Math.round(cx+Math.cos(t)*(size*GT*0.33)-3),ay=Math.round(cy+Math.sin(t*1.3)*(size*GT*0.3));
    const fly=b.ico==='butterfly'||b.ico==='magpie';const hop=Math.floor(gTick/12+i)%2;
    items.push({foot:ay+7,draw:()=>{if(!fly){gg.fillStyle='rgba(0,0,8,.4)';gg.fillRect(ax+1,ay+6,5,1);}gg.drawImage(mini(b.ico),ax,ay-(fly?6+hop*2:hop));}});});
  const w=gWalker;if(w){const d=Math.hypot(w.tx-w.x,w.ty-w.y);if(d<1){w.t++;if(w.t>60){w.t=0;w.tx=GM+(off+0.5+Math.random()*(size-1))*GT;w.ty=GM+(off+1+Math.random()*(size-1.2))*GT;}}else{w.x+=(w.tx-w.x)/d*0.3;w.y+=(w.ty-w.y)/d*0.3;}
    items.push({foot:Math.round(w.y),draw:()=>{const x=Math.round(w.x)-5,y=Math.round(w.y)-17;gg.fillStyle='rgba(0,0,8,.45)';gg.fillRect(x+2,y+16,7,2);drawWalker(x,y,w.id,d>=1&&Math.floor(gTick/10)%2);}});}
  items.sort((a,b)=>a.foot-b.foot).forEach(it=>it.draw());
  gg.imageSmoothingEnabled=false;gFx.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=0.06;p.life--;gg.fillStyle=p.c;gg.fillRect(Math.round(p.x),Math.round(p.y),1,1);});gFx=gFx.filter(p=>p.life>0);
  gctx.imageSmoothingEnabled=false;gctx.clearRect(0,0,gcv.width,gcv.height);gctx.drawImage(gbuf,0,0,gcv.width,gcv.height);
}
